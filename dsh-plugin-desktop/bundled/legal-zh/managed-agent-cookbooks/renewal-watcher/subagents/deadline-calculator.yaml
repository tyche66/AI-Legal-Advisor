name: renewal-deadline-calculator
model: claude-opus-4-7
system:
  text: |
    你收到 repo-reader 校验后的合同清单。你执行纯计算：对每份合同，计算距期限的
    天数（`cancel_by_date` 与 `expiration_date` 中较早者减去今日），分类紧迫度，
    并对照部署团队的 renewal-tracker 配置交叉核对——前瞻窗口、续约定价与自动续约
    上限的 playbook 立场，以及升级矩阵。

    将每份合同归入恰好一个紧迫度档：
      - `overdue`       —— 期限已过
      - `next_30_days`  —— 未来 1 至 30 天
      - `30_to_60_days` —— 未来 31 至 60 天
      - `60_to_90_days` —— 未来 61 至 90 天
      - `90_to_180_days`—— 未来 91 至 180 天
      - `outside_window`—— 超出所配前瞻窗口（从输出中排除）

    对每条提醒，判定是否存在部署团队 playbook 的任何偏离（无上限的续约涨价条款、
    过短的通知窗口、通知机制与团队标准不符等），以及升级矩阵是否要求路由至具名
    审批人。

    你是纯计算。你无 MCP、无网络、无 Write。你读取交给你的结构化 JSON 与磁盘上的
    playbook 配置文件。只返回 schema 校验的 JSON。

tools:
  - type: agent_toolset_20260401
    default_config: { enabled: false }
    configs:
      - { name: read, enabled: true }
      - { name: grep, enabled: true }
      - { name: glob, enabled: true }

mcp_servers: []
skills: []
callable_agents: []

output_schema:
  type: object
  required: [as_of, alerts]
  additionalProperties: false
  properties:
    as_of: { type: string, maxLength: 10, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$" }
    alerts:
      type: array
      maxItems: 500
      items:
        type: object
        additionalProperties: false
        required: [contract_id, deadline_type, deadline_date, days_remaining, urgency]
        properties:
          contract_id:    { type: string, maxLength: 64 }
          counterparty:   { type: string, maxLength: 200 }
          deadline_type:  { type: string, maxLength: 24,  pattern: "^(cancel_by|expiration|notice_window)$" }
          deadline_date:  { type: string, maxLength: 10,  pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$" }
          days_remaining: { type: integer, minimum: -3650, maximum: 3650 }
          urgency:        { type: string, maxLength: 24,  pattern: "^(overdue|next_30_days|30_to_60_days|60_to_90_days|90_to_180_days)$" }
          recommended_action:
            type: string
            maxLength: 300
          escalation_needed: { type: boolean }
          escalation_to:
            type: string
            maxLength: 120
          playbook_deviations:
            type: array
            maxItems: 20
            items:
              type: object
              additionalProperties: false
              required: [clause, position]
              properties:
                clause:   { type: string, maxLength: 64 }
                position: { type: string, maxLength: 300 }
                severity: { type: string, maxLength: 16,  pattern: "^(minor|moderate|critical)$" }
