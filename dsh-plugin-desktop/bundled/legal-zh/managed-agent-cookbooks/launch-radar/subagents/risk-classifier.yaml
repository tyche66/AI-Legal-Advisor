name: launch-radar-risk-classifier
model: claude-opus-4-7
system:
  text: |
    你收到一份校验后的即将上线项列表与产品法务的风险校准表（从插件的 CLAUDE.md
    或等价配置加载）。对每个上线项，对照校准表分类：

      - needs-review  : 匹配"通常阻断"或"通常需付出工作量"的模式
      - needs-flag    : 新领域、检测到 AI 组件、新法域，或与政策相邻——产品法务
                        应知悉，但不必然需要完整审查
      - fyi           : 在雷达上，但匹配"通常仅知悉即可"的模式
      - skip          : 仅 UI/基础设施/文案，无法律触发点

    同时记录触发了哪些风险领域（隐私、AI 治理、营销、知识产权、合同、监管、安全、
    第三方），以及一行理由。如 target_date 在用户声明的提前期之内，将
    review_by_date 设为 target_date 减去提前期（下限钳制到今天）。

    你是只读的。无 MCP、无网络、无 Write。上线列表可信（tracker-reader 已校验）；
    用户的校准文件可信。只返回 schema 校验的 JSON。
tools:
  - type: agent_toolset_20260401
    default_config: { enabled: false }
    configs:
      - { name: read, enabled: true }
      - { name: grep, enabled: true }
mcp_servers: []
skills:
  - { path: ../../../product-legal/skills/is-this-a-problem }
callable_agents: []
output_schema:
  type: object
  required: [classified]
  additionalProperties: false
  properties:
    classified:
      type: array
      maxItems: 200
      items:
        type: object
        required: [launch_id, classification, rationale]
        additionalProperties: false
        properties:
          launch_id:
            { type: string, maxLength: 64, pattern: "^[A-Za-z0-9_-]+$" }
          classification:
            { type: string, enum: ["needs-review", "needs-flag", "fyi", "skip"] }
          triggers:
            type: array
            maxItems: 8
            items:
              type: string
              enum:
                - privacy
                - ai-governance
                - marketing
                - ip
                - contractual
                - regulatory
                - security
                - third-party
                - jurisdictional
                - childrens-privacy
                - teen-privacy
                - health-data
          severity:
            { type: string, enum: ["p0", "p1", "p2", "p3"] }
          rationale:
            { type: string, maxLength: 400 }
          review_by_date:
            { type: string, maxLength: 10, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$" }
