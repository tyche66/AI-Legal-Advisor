name: diligence-normalizer
model: claude-opus-4-7
system:
  text: |
    你在扇出之后收到完整的抽取表格，并执行 tabular-review 技能描述的归一化
    环节——正是这道环节捕获每个表格化审查工具的失败模式：同一条款在不同文档间
    被不一致地解读。

    对每个 `classify` 列：
      - 每个 `answered` 值都必须出现在选项列表中。不在其中的是离群值——标记它们，
        并建议采用最接近的选项或 `needs_review`。
      - 扫描可疑的少数聚簇。如 195 份文档说 `consent_required` 而 5 份说
        `freely_assignable`，标记那 5 份供抽查。

    对每个 `date`、`duration` 与 `currency` 列：
      - 检查跨行的格式一致性。标记混用格式。
      - 标记不合理的值：99 年期限、0 元上限、1900 年之前的日期、该交易并不使用
        的币种。

    对每个 `verbatim` 列：
      - 你无法重读来源——那是 extractor 的范围。但你可以标记可疑的改述迹象：
        含"大约""基本上""概括性副词"，或来源提示中并不存在的方括号的答案。

    返回标记与逐列摘要计数。不要改写单元格；仅建议更正。grid-writer 产出最终
    输出；你产出它写入摘要 `Flags` 节的标记列表。

    只读。无 MCP。无 Write。无对外网络。只返回符合 schema 的 JSON。
tools:
  - type: agent_toolset_20260401
    default_config: { enabled: false }
    configs:
      - { name: read, enabled: true }
      - { name: grep, enabled: true }
mcp_servers: []
skills: []
callable_agents: []
output_schema:
  type: object
  required: [flags, column_summary]
  additionalProperties: false
  properties:
    flags:
      type: array
      maxItems: 5000
      items:
        type: object
        additionalProperties: false
        required: [doc_id, column_id, issue]
        properties:
          doc_id:        { type: string, maxLength: 64,  pattern: "^[A-Za-z0-9_.-]+$" }
          column_id:     { type: string, maxLength: 64,  pattern: "^[a-z0-9_]+$" }
          issue:
            type: string
            enum:
              - out_of_options
              - minority_cluster
              - format_inconsistent
              - implausible_value
              - paraphrase_suspected
              - missing_quote
              - other
          suggested_fix: { type: string, maxLength: 500 }
          note:          { type: string, maxLength: 500 }
    column_summary:
      type: array
      maxItems: 200
      items:
        type: object
        additionalProperties: false
        required: [column_id, answered, not_present, unclear, needs_review]
        properties:
          column_id:     { type: string, maxLength: 64, pattern: "^[a-z0-9_]+$" }
          answered:      { type: integer, minimum: 0 }
          not_present:   { type: integer, minimum: 0 }
          unclear:       { type: integer, minimum: 0 }
          needs_review:  { type: integer, minimum: 0 }
          outliers:      { type: integer, minimum: 0 }
          flagged:       { type: boolean }
