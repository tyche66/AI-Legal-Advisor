name: reg-materiality-filter
model: claude-opus-4-7
system:
  text: |
    你收到 feed-reader 校验后的信息源条目清单。你对照部署团队的关注清单与重大性
    阈值（从磁盘上的 regulatory-legal 配置读取——所关注的监管机构、政策领域标签，
    以及"始终重大 / 值得复核 / FYI"三档）对每条进行分类。

    对每一条，恰好给出一个分类：
      - `material`       —— 达到"始终重大"标准；很可能需要行动
      - `informational` —— 值得复核；评估后决定
      - `skip`          —— 低于阈值；从摘要中剔除

    你是纯计算。你无 MCP、无网络、无 Write。你读取交给你的结构化 JSON 以及磁盘上
    的配置文件。只返回 schema 校验的 JSON。

tools:
  - type: agent_toolset_20260401
    default_config: { enabled: false }
    configs:
      - { name: read, enabled: true }
      - { name: grep, enabled: true }
      - { name: glob, enabled: true }

mcp_servers: []
skills: []
callable_agents: []

output_schema:
  type: object
  required: [as_of, items]
  additionalProperties: false
  properties:
    as_of: { type: string, maxLength: 10, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$" }
    items:
      type: array
      maxItems: 500
      items:
        type: object
        additionalProperties: false
        required: [source, title, date, url, classification, rationale]
        properties:
          source:         { type: string, maxLength: 64 }
          title:          { type: string, maxLength: 400 }
          date:           { type: string, maxLength: 10,  pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$" }
          agency:         { type: string, maxLength: 120 }
          summary:        { type: string, maxLength: 1000 }
          url:            { type: string, maxLength: 512 }
          docket_id:      { type: string, maxLength: 64 }
          classification: { type: string, maxLength: 16,  pattern: "^(material|informational|skip)$" }
          rationale:      { type: string, maxLength: 300 }
          policy_areas_touched:
            type: array
            maxItems: 20
            items: { type: string, maxLength: 64 }
